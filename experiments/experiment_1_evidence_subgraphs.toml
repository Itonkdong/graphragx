# Experiment 1: evidence-subgraph construction with the winning NBFNet retriever.
#
# This experiment makes no LLM calls. It reuses the three NBFNet retriever runs
# from Experiment 0 and compares:
# - shortest-path union (one baseline per retriever seed)
# - PCST with constant edge costs at lambda 0.01, 0.25, 0.5, and 1.0
# - PCST with semantic edge costs at lambda 0.01, 0.25, 0.5, and 1.0
#
# The same lambda grid is used for both PCST modes to keep the sweep compact and
# directly comparable. Each command creates a fresh W&B run containing copied
# retriever metrics and evidence metrics, with `_sp` or `_pcst` in its title.
# Existing `--evidence-run-name` values are retained as persisted W&B lineage.

version = 1

[defaults]
args = [
  "--evidence-only",
  "--dataset", "WebQSP",
  "--default",
]

[[runs]]
id = "exp1_nbfnet_seed42_sp"
wandb_lineage_name = "exp1a_nbfnet_seed42_sp"
args = [
  "--retriever-run-name", "exp0_nbfnet_seed42_retriever",
  "--subgraph-algorithm", "shortest_path",
  "--seed", "42",
  "--evidence-run-name", "exp1_nbfnet_seed42_sp",
]

[[runs]]
id = "exp1_nbfnet_seed42_pcst_constant_lambda_0p01"
wandb_lineage_name = "exp1a_nbfnet_seed42_pcst_constant_lambda_0p01"
args = [
  "--retriever-run-name", "exp0_nbfnet_seed42_retriever",
  "--subgraph-algorithm", "pcst",
  "--pcst-edge-cost-strategy", "constant",
  "--pcst-edge-cost", "0.01",
  "--seed", "42",
  "--evidence-run-name", "exp1_nbfnet_seed42_pcst_constant_lambda_0p01",
]

